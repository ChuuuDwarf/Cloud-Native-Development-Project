# SonarCloud automatic-analysis configuration.
# Docs: https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis
#
# NOTE: SonarCloud's *automatic* analysis reads THIS file (.sonarcloud.properties),
# not sonar-project.properties (which is only used for CI/scanner-based analysis).

# --- Test code layout -------------------------------------------------------
# Mark test + dev-script trees as test sources so security/credential rules are
# scoped appropriately and they don't count against production code quality.
sonar.tests=backend/tests,tests
sonar.test.inclusions=backend/tests/**/*,tests/**/*

# --- Scoped rule ignores ----------------------------------------------------
# S2068 ("hard-coded credentials") fires on seed/demo passwords that are NOT
# real secrets: pytest fixtures, dev smoke scripts, and the demo quick-login
# buttons. Suppress the rule only in those locations; it stays active for real
# application code.
sonar.issue.ignore.multicriteria=creds1,creds2,creds3,lock1

# pytest fixtures (login flows seed the demo users with known passwords)
sonar.issue.ignore.multicriteria.creds1.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.creds1.resourceKey=backend/tests/**/*

# dev / smoke scripts (local-only, talk to the seeded demo DB)
sonar.issue.ignore.multicriteria.creds2.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.creds2.resourceKey=backend/scripts/**/*

# demo quick-login buttons — intentionally public demo accounts
sonar.issue.ignore.multicriteria.creds3.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.creds3.resourceKey=frontend/components/LoginForm.tsx

# S8565 ("dependency versions unpredictable without a lock file") — false here:
# backend/requirements.txt pins every dependency with == (it IS the lock file);
# pyproject.toml deliberately declares no [project.dependencies].
sonar.issue.ignore.multicriteria.lock1.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.lock1.resourceKey=backend/pyproject.toml
