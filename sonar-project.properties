sonar.projectKey=code-quality-cloud-native-project
sonar.projectName=code-quality-cloud-native-project
sonar.sourceEncoding=UTF-8

# ---- 原始碼（產品碼）----
sonar.sources=frontend,backend/app

# ---- 測試碼 ----
# frontend 同時出現在 sources/tests，靠下面的 test.inclusions 判定哪些是測試，其餘算產品碼
sonar.tests=backend/tests,frontend
sonar.test.inclusions=frontend/**/*.test.ts,frontend/**/*.test.tsx,frontend/**/*.spec.ts,frontend/**/*.spec.tsx,backend/tests/**

# ---- 語言版本（讓 Python 規則判斷更準）----
sonar.python.version=3.12

# ---- 覆蓋率報告 ----
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ---- 測試執行結果（pass/fail 數，選用）----
sonar.python.xunit.reportPath=backend/pytest-junit.xml

# ---- 不分析的檔案 ----
sonar.exclusions=**/node_modules/**,**/.next/**,**/venv/**,**/__pycache__/**,**/htmlcov/**,backend/alembic/**,**/*.config.ts,**/*.config.js

# ---- 不計入覆蓋率分母的檔案（測試檔/遷移/設定/自動產生）----
sonar.coverage.exclusions=backend/tests/**,frontend/**/*.test.ts,frontend/**/*.test.tsx,frontend/**/*.spec.ts,frontend/**/*.spec.tsx,backend/alembic/**,**/*.config.ts,**/*.config.js,frontend/src/constants/enums.ts
